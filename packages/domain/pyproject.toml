[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-math-domain"
version = "0.1.0"
description = "AI 数学抽卡系统 · Problem Card 领域模型（状态机/发布门禁/Pydantic 镜像）"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.5"]

[tool.setuptools.packages.find]
where = ["src"]
